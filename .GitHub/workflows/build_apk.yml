# Builds the release APK entirely in the cloud.
# You only need a phone: edit files on github.com, tap "Run workflow",
# then download the APK artifact and install it.
name: Build APK

on:
  workflow_dispatch:   # manual "Run workflow" button
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the android/ folder in the cloud (no PC needed).
      # git restore afterwards guarantees YOUR lib/ and pubspec.yaml win.
      - name: Generate Android project shell
        run: |
          flutter create . --org com.wardrobestylist --project-name wardrobe_stylist --platforms android
          git checkout -- pubspec.yaml lib || true

      # flutter_local_notifications REQUIRES core library desugaring;
      # flutter create does not enable it, so we patch the generated file.
      - name: Enable desugaring (required for notifications)
        run: |
          python3 - <<'EOF'
          p = "android/app/build.gradle"
          s = open(p).read()
          if "coreLibraryDesugaringEnabled" not in s:
              s = s.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
          if "coreLibraryDesugaring " not in s:
              line = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
              if "dependencies {" in s:
                  s = s.replace("dependencies {", "dependencies {\n" + line, 1)
              else:
                  s += "\ndependencies {\n" + line + "\n}\n"
          open(p, "w").write(s)
          print("desugaring patch applied")
          EOF

      # Daily outfit notifications need this on Android 13+
      - name: Allow notifications (Android 13+)
        run: |
          sed -i 's|<application|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      # Model fetched at build time -> repo stays small, app stays offline.
      # Labels are GENERATED from TF.js ImageNet class list (stable source).
      - name: Fetch offline AI model + labels
        run: |
          mkdir -p assets
          curl -fSL -o model.tgz https://storage.googleapis.com/download.tensorflow.org/models/mobilenet_v1_2018_08_02/mobilenet_v1_1.0_224_quant.tgz \
            || curl -fSL -o assets/mobilenet_v1_1.0_224_quant.tflite https://raw.githubusercontent.com/tflite-soc/tensorflow-models/master/mobilenet-v1/mobilenet_v1_1.0_224_quant.tflite
          test -f assets/mobilenet_v1_1.0_224_quant.tflite || tar -xzf model.tgz -C assets
          test -f assets/mobilenet_v1_1.0_224_quant.tflite || (echo "MODEL MISSING" && exit 1)
          curl -fSL -o classes.ts https://raw.githubusercontent.com/tensorflow/tfjs-models/master/mobilenet/src/imagenet_classes.ts
          { echo "background"; grep -E "^[[:space:]]*[0-9]+: '" classes.ts | sed -E "s/^[[:space:]]*[0-9]+: '//; s/',?[[:space:]]*$//"; } > assets/labels.txt
          test "$(wc -l < assets/labels.txt)" -eq 1001 || (echo "BAD LABEL COUNT: $(wc -l < assets/labels.txt)" && exit 1)

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-stylist-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30