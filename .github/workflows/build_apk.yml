name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project shell
        run: |
          flutter create . --org com.wardrobestylist --project-name wardrobe_stylist --platforms android
          git checkout -- pubspec.yaml lib || true

      - name: Enable desugaring (required for notifications)
        run: |
          python3 - <<'EOF'
          import os
          candidates = [p for p in ("android/app/build.gradle", "android/app/build.gradle.kts") if os.path.exists(p)]
          assert candidates, "no app-level gradle file found"
          p = candidates[0]
          kts = p.endswith(".kts")
          s = open(p).read()
          if "desugar_jdk_libs" not in s:
              flag = "isCoreLibraryDesugaringEnabled = true" if kts else "coreLibraryDesugaringEnabled true"
              assert "compileOptions {" in s, "compileOptions block not found"
              s = s.replace("compileOptions {", "compileOptions {\n        " + flag, 1)
              dep = ('    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' if kts
                     else "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'")
              if "dependencies {" in s:
                  s = s.replace("dependencies {", "dependencies {\n" + dep, 1)
              else:
                  s += "\ndependencies {\n" + dep + "\n}\n"
          open(p, "w").write(s)
          print("desugaring patch applied to", p)
          EOF

      - name: Allow notifications (Android 13+)
        run: |
          sed -i 's|<application|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Fetch offline AI model + labels
        run: |
          mkdir -p assets
          curl -fSL -o model.tgz https://storage.googleapis.com/download.tensorflow.org/models/mobilenet_v1_2018_08_02/mobilenet_v1_1.0_224_quant.tgz \
            || curl -fSL -o assets/mobilenet_v1_1.0_224_quant.tflite https://raw.githubusercontent.com/tflite-soc/tensorflow-models/master/mobilenet-v1/mobilenet_v1_1.0_224_quant.tflite
          test -f assets/mobilenet_v1_1.0_224_quant.tflite || tar -xzf model.tgz -C assets
          test -f assets/mobilenet_v1_1.0_224_quant.tflite || (echo "MODEL MISSING" && exit 1)
          curl -fSL -o classes.ts https://raw.githubusercontent.com/tensorflow/tfjs-models/master/mobilenet/src/imagenet_classes.ts
          { echo "background"; grep -E "^[[:space:]]*[0-9]+: '" classes.ts | sed -E "s/^[[:space:]]*[0-9]+: '//; s/',?[[:space:]]*$//"; } > assets/labels.txt
          test "$(wc -l < assets/labels.txt)" -eq 1001 || (echo "BAD LABEL COUNT: $(wc -l < assets/labels.txt)" && exit 1)

      - run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release > build.log 2>&1 || {
            echo "================ BUILD FAILED ================"
            echo "================ ACTUAL ERROR ================"
            grep -n -A 30 "What went wrong" build.log | head -80
            grep -n -B3 -A 15 "FAILURE:" build.log | head -60
            echo "================ first error lines ================"
            grep -n -i -m 8 "error" build.log
            exit 1
          }
          echo "BUILD OK"; ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-stylist-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
