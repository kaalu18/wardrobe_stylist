# Builds the release APK entirely in the cloud.
# You only need a phone: edit files on github.com, tap "Run workflow",
# then download the APK artifact and install it.
name: Build APK

on:
  workflow_dispatch:   # manual "Run workflow" button
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the android/ folder in the cloud (no PC needed).
      # git restore afterwards guarantees YOUR lib/ and pubspec.yaml win.
      - name: Generate Android project shell
        run: |
          flutter create . --org com.wardrobestylist --project-name wardrobe_stylist --platforms android
          git checkout -- pubspec.yaml lib || true

      # Model fetched at build time -> repo stays small, app stays offline.
      - name: Fetch offline AI model + labels
        run: |
          mkdir -p assets
          curl -L -o model.tgz https://storage.googleapis.com/download.tensorflow.org/models/mobilenet_v1_1.0_224_quant.tgz
          tar -xzf model.tgz -C assets || true
          test -f assets/mobilenet_v1_1.0_224_quant.tflite || (echo "MODEL MISSING" && exit 1)
          curl -L -o assets/labels.txt https://raw.githubusercontent.com/tensorflow/examples/master/lite/examples/image_classification/android/app/src/main/assets/labels_mobilenet_quant_v1_224.txt

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-stylist-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
