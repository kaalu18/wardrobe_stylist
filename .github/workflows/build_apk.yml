name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project shell
        run: |
          flutter create . --org com.wardrobestylist --project-name wardrobe_stylist --platforms android
          git checkout -- pubspec.yaml lib || true

      - name: Fetch offline AI model + labels
        run: |
          mkdir -p assets
          curl -fSL -o model.tgz https://storage.googleapis.com/download.tensorflow.org/models/mobilenet_v1_2018_08_02/mobilenet_v1_1.0_224_quant.tgz \
            || curl -fSL -o assets/mobilenet_v1_1.0_224_quant.tflite https://raw.githubusercontent.com/tflite-soc/tensorflow-models/master/mobilenet-v1/mobilenet_v1_1.0_224_quant.tflite
          test -f assets/mobilenet_v1_1.0_224_quant.tflite || tar -xzf model.tgz -C assets
          test -f assets/mobilenet_v1_1.0_224_quant.tflite || (echo "MODEL MISSING" && exit 1)
          curl -fSL -o assets/labels.txt https://raw.githubusercontent.com/tensorflow/examples/master/lite/examples/image_classification/android/app/src/main/assets/labels_mobilenet_quant_v1_224.txt \
            || curl -fSL -o assets/labels.txt https://raw.githubusercontent.com/Mesa3D/mesa/main/src/gallium/frontends/teflon/tests/labels_mobilenet_quant_v1_224.txt \
            || (echo "LABELS MISSING" && exit 1)

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-stylist-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
