name: wardrobe_stylist
description: Offline AI wardrobe stylist for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  image: ^4.2.0
  palette_generator: ^0.3.3+3
  tflite_flutter: ^0.11.0
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.2.1+2

flutter:
  uses-material-design: true
  assets:
    - assets/mobilenet_v1_1.0_224_quant.tflite
    - assets/labels.txt
